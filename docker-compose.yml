version: '3.8'

services:
  db:
    image: postgres:13
    network_mode: host
    environment:
      POSTGRES_DB: lanchonete
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    network_mode: host
    extra_hosts:
      - "db:127.0.0.1"
    depends_on:
      db:
        condition: service_healthy